[package]
name = "hype"
version = "0.1.0"
edition = "2024"
description = "Fast Multi-Protocol Host Discovery."
authors = ["blakravat"]
license = "MIT"

[dependencies]
thiserror = "2.0.19"
indicatif = "0.18.6"
futures = "0.3.33"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time"]}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
surge-ping = "0.9.0"
pnet = "0.35.0"
rand = "0.10.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"